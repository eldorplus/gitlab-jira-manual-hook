<svg version="1.0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <!-- Styles globaux -->
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 6px; }
      .box-highlight { fill: #1f242c; stroke: #f1502f; stroke-width: 2; rx: 6px; }
      .box-db { fill: #1f242c; stroke: #4169e1; stroke-width: 2; rx: 6px; }
      .text-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #c9d1d9; font-weight: 500; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #ffffff; font-weight: bold; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #8b949e; font-weight: bold; }
      .arrow { stroke: #8b949e; stroke-width: 2; fill: none; stroke-dasharray: 4,4; animation: dash 20s linear infinite; }
      .arrow-solid { stroke: #58a6ff; stroke-width: 2; fill: none; }
      .arrow-error { stroke: #f85149; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #8b949e; }
      .arrow-head-solid { fill: #58a6ff; }
      .arrow-head-error { fill: #f85149; }
    </style>
    
    <!-- Définition des flèches -->
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 Z" class="arrow-head" />
    </marker>
    <marker id="arr-solid" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 Z" class="arrow-head-solid" />
    </marker>
    <marker id="arr-error" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 Z" class="arrow-head-error" />
    </marker>
  </defs>

  <!-- Fond -->
  <rect width="100%" height="100%" class="bg" />

  <!-- === SECTION GITLAB (SOURCE) === -->
  <rect x="40" y="85" width="140" height="150" class="box-highlight" />
  <text x="110" y="115" text-anchor="middle" class="text-title" fill="#f1502f">🦊 GitLab</text>
  
  <!-- Groupes de déclencheurs (Hooks) -->
  <rect x="55" y="135" width="110" height="35" class="box" />
  <text x="110" y="157" text-anchor="middle" class="text-main">Job Hook</text>
  
  <rect x="55" y="185" width="110" height="35" class="box" />
  <text x="110" y="207" text-anchor="middle" class="text-main">Pipeline Hook</text>

  <!-- === NŒUD API CENTRAL === -->
  <rect x="240" y="135" width="80" height="85" class="box" stroke="#58a6ff" />
  <text x="280" y="184" text-anchor="middle" class="text-title">⚡ API</text>

  <!-- === FLUX 1 : TRAITEMENT & QUEUE (HAUT) === -->
  <rect x="370" y="70" width="90" height="40" class="box" />
  <text x="415" y="95" text-anchor="middle" class="text-main">🛡️ Policy</text>

  <rect x="490" y="70" width="110" height="40" class="box" />
  <text x="545" y="95" text-anchor="middle" class="text-main">🔄 Idempotency</text>

  <!-- PostgreSQL Queue -->
  <rect x="630" y="70" width="140" height="40" class="box" stroke="#4169e1" />
  <text x="700" y="95" text-anchor="middle" class="text-title">📦 PG Queue</text>

  <!-- Worker & Cible Externe -->
  <rect x="810" y="70" width="90" height="40" class="box" />
  <text x="855" y="95" text-anchor="middle" class="text-main">⚙️ Worker</text>

  <rect x="810" y="165" width="90" height="40" class="box" stroke="#0052cc" />
  <text x="855" y="190" text-anchor="middle" class="text-title" fill="#0052cc">🟦 Jira</text>

  <!-- Dead Letter Queue & Retry -->
  <rect x="630" y="165" width="140" height="40" class="box" stroke="#f85149" />
  <text x="700" y="190" text-anchor="middle" class="text-main" fill="#f85149">⚠️ DLQ</text>
  
  <path d="M 870,70 L 870,45 L 790,45 L 790,80 L 810,80" class="arrow-error" marker-end="url(#arr-error)" />
  <text x="780" y="38" text-anchor="middle" class="text-muted" fill="#f85149">RETRY</text>

  <!-- === FLUX 2 : OBSERVABILITÉ (BAS) === -->
  <!-- Elasticsearch + Kibana -->
  <rect x="370" y="250" width="120" height="40" class="box" />
  <text x="430" y="275" text-anchor="middle" class="text-main">🔍 Elasticsearch</text>

  <rect x="530" y="250" width="90" height="40" class="box" />
  <text x="575" y="275" text-anchor="middle" class="text-main">📊 Kibana</text>

  <!-- OpenTelemetry + Collector -->
  <rect x="370" y="320" width="130" height="40" class="box" />
  <text x="435" y="345" text-anchor="middle" class="text-main">🔭 OpenTelemetry</text>

  <rect x="540" y="320" width="130" height="40" class="box" />
  <text x="605" y="345" text-anchor="middle" class="text-main">📥 OTLP Collector</text>

  <!-- === INFRASTRUCTURE KUBERNETES (BAS PAGE) === -->
  <rect x="40" y="420" width="860" height="80" class="box-db" />
  <text x="60" y="445" class="text-title" fill="#4169e1">💾 COUCHE INFRASTRUCTURE (KUBERNETES)</text>
  
  <g transform="translate(60, 455)">
    <rect x="0" y="0" width="150" height="30" class="box" />
    <text x="75" y="19" text-anchor="middle" class="text-main">🗄️ PostgreSQL</text>
    
    <path d="M 150,15 L 200,15" class="arrow-solid" marker-end="url(#arr-solid)" />
    
    <rect x="210" y="0" width="150" height="30" class="box" />
    <text x="285" y="19" text-anchor="middle" class="text-main">☸️ StatefulSet</text>
    
    <path d="M 360,15 L 410,15" class="arrow-solid" marker-end="url(#arr-solid)" />
    
    <rect x="420" y="0" width="220" height="30" class="box" />
    <text x="530" y="19" text-anchor="middle" class="text-main">💾 volumeClaimTemplates</text>
  </g>

  <!-- === LIAISONS ET FLÈCHES DES FLUX === -->
  <!-- Liens GitLab vers API -->
  <path d="M 165,152.5 L 200,152.5 L 200,160 L 240,160" class="arrow-solid" marker-end="url(#arr-solid)" />
  <path d="M 165,202.5 L 200,202.5 L 200,190 L 240,190" class="arrow-solid" marker-end="url(#arr-solid)" />

  <!-- API vers Policy -->
  <path d="M 320,160 L 345,160 L 345,90 L 370,90" class="arrow-solid" marker-end="url(#arr-solid)" />

  <!-- Policy -> Idempotency -> PG Queue -> Worker -> Jira -->
  <path d="M 460,90 L 490,90" class="arrow-solid" marker-end="url(#arr-solid)" />
  <path d="M 600,90 L 630,90" class="arrow-solid" marker-end="url(#arr-solid)" />
  <path d="M 770,90 L 810,90" class="arrow-solid" marker-end="url(#arr-solid)" />
  <path d="M 855,110 L 855,165" class="arrow-solid" marker-end="url(#arr-solid)" />

  <!-- Erreur PG Queue vers DLQ -->
  <path d="M 700,110 L 700,165" class="arrow-error" marker-end="url(#arr-error)" />

  <!-- API vers Elasticsearch -> Kibana -->
  <path d="M 320,180 L 345,180 L 345,270 L 370,270" class="arrow-solid" marker-end="url(#arr-solid)" />
  <path d="M 490,270 L 530,270" class="arrow-solid" marker-end="url(#arr-solid)" />

  <!-- API vers OpenTelemetry -> OTLP -->
  <path d="M 280,220 L 280,340 L 370,340" class="arrow-solid" marker-end="url(#arr-solid)" />
  <path d="M 500,340 L 540,340" class="arrow-solid" marker-end="url(#arr-solid)" />
</svg>