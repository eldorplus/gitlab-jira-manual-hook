[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitlab-jira-manual-hook"
version = "0.1.0"
description = "Create Jira issues for GitLab CI jobs waiting for manual action and observe GitLab pipelines in Elasticsearch"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "asyncpg>=0.30,<1",
  "PyYAML>=6.0,<7",
  "elasticsearch[async]>=9,<10",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
