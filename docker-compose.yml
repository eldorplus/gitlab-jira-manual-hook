services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: manualhook
      POSTGRES_USER: manualhook
      POSTGRES_PASSWORD: manualhook
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manualhook -d manualhook"]
      interval: 5s
      timeout: 5s
      retries: 10
