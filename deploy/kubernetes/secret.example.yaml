apiVersion: v1
kind: Secret
metadata:
  name: gitlab-jira-manual-hook
  namespace: gitlab-jira-manual-hook
type: Opaque
stringData:
  GITLAB_WEBHOOK_TOKEN: replace-me
  JIRA_BASE_URL: https://your-domain.atlassian.net
  JIRA_EMAIL: replace-me
  JIRA_API_TOKEN: replace-me
  JIRA_PROJECT_KEY: OPS
  JIRA_ISSUE_TYPE: Task
  DATABASE_URL: postgresql://manualhook:change-me@postgres:5432/manualhook
