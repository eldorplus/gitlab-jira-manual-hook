apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-jira-manual-hook
  namespace: gitlab-jira-manual-hook
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitlab-jira-manual-hook
  template:
    metadata:
      labels:
        app: gitlab-jira-manual-hook
    spec:
      containers:
        - name: app
          image: ghcr.io/eldorplus/gitlab-jira-manual-hook:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: gitlab-jira-manual-hook
            - configMapRef:
                name: gitlab-jira-manual-hook-elasticsearch
            - secretRef:
                name: gitlab-jira-manual-hook
            - secretRef:
                name: gitlab-jira-manual-hook-elasticsearch
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: manualhook
            - name: POSTGRES_USER
              value: manualhook
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-jira-manual-hook
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-data
          emptyDir: {}
