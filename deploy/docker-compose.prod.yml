services:
  app:
    image: ghcr.io/eldorplus/gitlab-jira-manual-hook:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manualhook}
      POSTGRES_USER: ${POSTGRES_USER:-manualhook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manualhook} -d ${POSTGRES_DB:-manualhook}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
